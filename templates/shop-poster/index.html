<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"offer","type":"string","label":"The offer (opens the film)","default":"2 for 1","group":"Offer"},
  {"id":"offerSub","type":"string","label":"Small line under the offer","default":"Weekend flat white","group":"Offer"},
  {"id":"name","type":"string","label":"Shop name","default":"Northwind Café","group":"Shop"},
  {"id":"eyebrow","type":"string","label":"Small line over the name (place, trade)","default":"Main St","group":"Shop"},
  {"id":"line1","type":"string","label":"Line 1 (empty = none)","default":"Fresh pastries daily","group":"Lines"},
  {"id":"line2","type":"string","label":"Line 2 (empty = none)","default":"Oat milk at no extra cost","group":"Lines"},
  {"id":"cta","type":"string","label":"Button","default":"Visit us Saturday","group":"Ending"},
  {"id":"ctaSub","type":"string","label":"Small line under the button","default":"Main St","group":"Ending"},
  {"id":"style","type":"string","label":"Style: riso (print poster), chalk (menu board) or kraft (market stamp)","default":"riso","group":"Look"},
  {"id":"duration","type":"number","label":"Length (seconds)","default":7,"min":2,"max":60,"step":0.5,"group":"Pacing"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>framehand · Shop poster</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #F3EBDD; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F3EBDD; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Shop poster (y6): a warm local-business poster that builds itself, drawn entirely in code (no stock pictures).
  Styles: riso (risograph print), chalk (café menu board), kraft (market stall stamps). The offer opens the film,
  then the shop name, the lines and the button pin themselves around it. data.image = your photo (taped print or
  full-bleed under a scrim with data.photoMode = "bleed").
  - Pickable regions: offer · title · point-<i> · cta · photo.  Scenes: offer → name → line-1… → cta.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="poster" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y6_poster",
  "duration": "{{duration}}",
  "pace": 1,
  "fps": 30,
  "data": { "style": "{{style}}", "eyebrow": "{{eyebrow}}", "seed": 7 },
  "cues": [
    { "at": 0.0, "kind": "offer", "text": "{{offer}}", "sub": "{{offerSub}}" },
    { "at": 1.3, "kind": "title", "text": "{{name}}" },
    { "at": 2.3, "kind": "point", "text": "{{line1}}" },
    { "at": 3.1, "kind": "point", "text": "{{line2}}" },
    { "at": 4.2, "kind": "cta", "text": "{{cta}}", "sub": "{{ctaSub}}" }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y6_poster.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      spec.cues = spec.cues.filter((q) => String(q.text || '').trim());
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
