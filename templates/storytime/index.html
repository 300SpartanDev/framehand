<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"line1","type":"string","label":"Line 1 as spoken (sets how long the mouth moves; shown in the bubble if the short bubble text is empty)","default":"The first time I asked AI to write my code,","group":"Line 1"},
  {"id":"bubble1","type":"string","label":"Line 1 short bubble text (a few words; empty = the spoken line)","default":"AI, build me a website!","group":"Line 1"},
  {"id":"line1Pose","type":"enum","label":"Line 1 pose","default":"talk","options":[{"value":"talk","label":"Talk"},{"value":"point","label":"Point"},{"value":"shrug","label":"Shrug"},{"value":"type","label":"Type"}],"group":"Line 1"},
  {"id":"typed","type":"string","label":"Cutaway: the line typed on the computer","default":"make me a website","group":"Computer screen"},
  {"id":"bigText","type":"string","label":"Cutaway: the big text that slams in","default":"3000 lines","group":"Computer screen"},
  {"id":"count","type":"number","label":"Counter (top right) stops at","default":3000,"min":0,"step":1,"group":"Computer screen"},
  {"id":"unit","type":"string","label":"Counter unit","default":"lines","group":"Computer screen"},
  {"id":"app","type":"string","label":"Window title","default":"AI helper","group":"Computer screen"},
  {"id":"hit","type":"number","label":"When the big text slams in (seconds; follows hitWord with a voiceover)","default":3.5,"min":0,"max":120,"step":0.05,"group":"Computer screen"},
  {"id":"line2","type":"string","label":"Line 2 (said after the reaction close-up)","default":"Where… do I paste all this?","group":"Line 2"},
  {"id":"line2Pose","type":"enum","label":"Line 2 pose","default":"point","options":[{"value":"talk","label":"Talk"},{"value":"point","label":"Point"},{"value":"shrug","label":"Shrug"},{"value":"type","label":"Type"}],"group":"Line 2"},
  {"id":"mark","type":"string","label":"Symbol that pops up at the end (empty = none)","default":"?","group":"Line 2"},
  {"id":"duration","type":"number","label":"Length (seconds; at least until the voiceover ends; keep 0.9 s after the punchline)","default":8.5,"min":2,"max":120,"step":0.5,"group":"Pacing"},
  {"id":"pace","type":"number","label":"Pace (1 = normal)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Pacing"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>framehand · Storytime</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #DCE9EC; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #DCE9EC; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Storytime (y4): a bean character talks to camera in a small room, snapping between poses; the joke lands with a cutaway (a computer screen and big slammed-in text) and a silent reaction close-up.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: y4_storytime, from framehand, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the thing first
    shows; `word` anchors it to that word of the narration once `om voice` has run; the insert's slam follows data.hitWord
    (skills/framehand/references/grammars.md). The reaction close-up needs silence: anchor it after the punch word.
  - Pickable regions (0-based like the spec): character · computer · line-<i> (bubble of the i-th point) · mark ·
    screen · typed · big-text · counter.
  - Scenes: talk-1 → screen-1 → react-1 → talk-2 → punchline-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="room" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y4_storytime",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "cues": [
    { "at": 0.1, "kind": "point", "word": "first", "text": "{{line1}}", "sub": "{{bubble1}}", "data": { "pose": "{{line1Pose}}" } },
    { "at": 2.0, "kind": "insert", "word": "website", "text": "{{bigText}}", "sub": "{{typed}}", "data": { "hit": "{{hit}}", "hitWord": "3000", "count": "{{count}}", "unit": "{{unit}}", "app": "{{app}}" } },
    { "at": 4.6, "kind": "react", "word": "3000", "edge": "end", "offset": 0.6 },
    { "at": 5.9, "kind": "point", "word": "where", "text": "{{line2}}", "data": { "pose": "{{line2Pose}}" } },
    { "at": 7.2, "kind": "highlight", "word": "paste", "edge": "end", "data": { "mark": "{{mark}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y4_storytime.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      for (const q of spec.cues) {
        if (q.sub === '') delete q.sub;                                  // no short bubble text → the bubble shows the line itself
        if (q.kind === 'insert' && !q.data.unit) delete q.data.unit;
      }
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || String(q.data.mark || '').trim());
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
