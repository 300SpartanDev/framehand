<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Why a good night’s sleep matters","group":"Text"},
  {"id":"point1","type":"string","label":"Point 1 (empty = skipped)","default":"Your brain sorts the day","group":"Step 1"},
  {"id":"draw1Text","type":"string","label":"Caption under icon 1 (empty = no icon)","default":"Memories","group":"Step 1"},
  {"id":"draw1Icon","type":"enum","label":"Icon 1","default":"stack","options":[{"value":"person"},{"value":"cat"},{"value":"network"},{"value":"doc"},{"value":"chat"},{"value":"bulb"},{"value":"check"},{"value":"cross"},{"value":"screen"},{"value":"stack"},{"value":"gear"},{"value":"target"},{"value":"clock"},{"value":"chart"}],"group":"Step 1"},
  {"id":"point2","type":"string","label":"Point 2 (empty = skipped)","default":"Your body repairs itself","group":"Step 2"},
  {"id":"draw2Text","type":"string","label":"Caption under icon 2 (empty = no icon)","default":"Repair","group":"Step 2"},
  {"id":"draw2Icon","type":"enum","label":"Icon 2","default":"network","options":[{"value":"person"},{"value":"cat"},{"value":"network"},{"value":"doc"},{"value":"chat"},{"value":"bulb"},{"value":"check"},{"value":"cross"},{"value":"screen"},{"value":"stack"},{"value":"gear"},{"value":"target"},{"value":"clock"},{"value":"chart"}],"group":"Step 2"},
  {"id":"point3","type":"string","label":"Point 3 (empty = skipped)","default":"You wake up sharper","group":"Step 3"},
  {"id":"draw3Text","type":"string","label":"Caption under icon 3 (empty = no icon)","default":"Focus","group":"Step 3"},
  {"id":"draw3Icon","type":"enum","label":"Icon 3","default":"chat","options":[{"value":"person"},{"value":"cat"},{"value":"network"},{"value":"doc"},{"value":"chat"},{"value":"bulb"},{"value":"check"},{"value":"cross"},{"value":"screen"},{"value":"stack"},{"value":"gear"},{"value":"target"},{"value":"clock"},{"value":"chart"}],"group":"Step 3"},
  {"id":"highlightIndex","type":"number","label":"Point to circle at the end (from 0; -1 = none)","default":2,"min":-1,"max":9,"step":1,"group":"Emphasis"},
  {"id":"highlightStyle","type":"enum","label":"Mark style","default":"circle","options":[{"value":"circle","label":"Circle it"},{"value":"underline","label":"Underline it"}],"group":"Emphasis"},
  {"id":"accent","type":"color","label":"Accent colour (bullets, arrows, circles)","default":"#EF7226","group":"Emphasis"},
  {"id":"duration","type":"number","label":"Length (seconds; with a voiceover, at least until it ends)","default":10,"min":2,"max":120,"step":0.5,"group":"Pacing"},
  {"id":"pace","type":"number","label":"Pace (1 = normal; real films hold each board about 6 s, 2–2.5 is common)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Pacing"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>framehand · Whiteboard</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #FBFBFB; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FBFBFB; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Whiteboard (y3, RSA style): write a line as it is said, draw a thing when it is mentioned. One marker writes, draws icons and arrows and circles the key point; the camera follows down the board and pulls back to show it all at the end.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: y3_whiteboard, from framehand, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the first stroke
    lands; `word` anchors it to that word of the narration once `om voice` has run — whiteboard writing looks right about
    0.5 s after the phrase starts, so the cues carry "offset": 0.5 (skills/framehand/references/grammars.md).
  - Writing speed adapts: a line always finishes before the next cue starts.
  - Pickable regions (0-based like the spec): title · point-<i> · draw-<i> (icon + caption) · image-<i>.
  - Scenes: title → point-1 → draw-1 → point-2 → draw-2 → point-3 → draw-3 → circle-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="board" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y3_whiteboard",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "accent": "{{accent}}" },
  "cues": [
    { "at": 0.0, "kind": "title", "text": "{{title}}" },
    { "at": 1.9, "kind": "point", "word": "brain", "offset": 0.5, "text": "{{point1}}" },
    { "at": 2.8, "kind": "draw", "word": "memories", "offset": 0.5, "text": "{{draw1Text}}", "data": { "icon": "{{draw1Icon}}" } },
    { "at": 3.9, "kind": "point", "word": "body", "offset": 0.5, "text": "{{point2}}" },
    { "at": 4.9, "kind": "draw", "word": "repair", "offset": 0.5, "text": "{{draw2Text}}", "data": { "icon": "{{draw2Icon}}" } },
    { "at": 6.0, "kind": "point", "word": "wake", "offset": 0.5, "text": "{{point3}}" },
    { "at": 6.9, "kind": "draw", "word": "sharper", "offset": 0.5, "text": "{{draw3Text}}", "data": { "icon": "{{draw3Icon}}" } },
    { "at": 8.0, "kind": "highlight", "word": "focus", "data": { "index": "{{highlightIndex}}", "style": "{{highlightStyle}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y3_whiteboard.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      const points = spec.cues.filter((q) => q.kind === 'point').length;
      for (const q of spec.cues) if (q.kind === 'highlight') {
        if (q.data.style !== 'underline') delete q.data.style;
        if (q.data.index >= points) CLIP.problem(`highlightIndex ${q.data.index} is past the number of points (${points} )`);
      }
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || (q.data.index >= 0 && q.data.index < points));
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
