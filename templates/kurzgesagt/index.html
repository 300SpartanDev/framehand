<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title (rises word by word at the top, fades at the first zoom)","default":"What is inside a coffee bean?","group":"Outer layer"},
  {"id":"center","type":"string","label":"Centre planet name","default":"Coffee bean","group":"Outer layer"},
  {"id":"point1","type":"string","label":"Moon 1 (empty = hidden)","default":"Hundreds of aromas","group":"Outer layer"},
  {"id":"point2","type":"string","label":"Moon 2 (empty = hidden)","default":"Natural oils","group":"Outer layer"},
  {"id":"point3","type":"string","label":"Moon 3 (empty = hidden)","default":"Caffeine","group":"Outer layer"},
  {"id":"diveIndex","type":"number","label":"Moon to dive into (counting from 0)","default":1,"min":0,"max":9,"step":1,"group":"Dive in"},
  {"id":"dive","type":"string","label":"New centre name after the dive","default":"Inside the oils","group":"Dive in"},
  {"id":"point4","type":"string","label":"Inner moon 1 (empty = hidden)","default":"Flavour","group":"Dive in"},
  {"id":"point5","type":"string","label":"Inner moon 2 (empty = hidden)","default":"Crema","group":"Dive in"},
  {"id":"highlightIndex","type":"number","label":"Inner moon to zoom into at the end (from 0; -1 = none)","default":0,"min":-1,"max":9,"step":1,"group":"Dive in"},
  {"id":"flow","type":"boolean","label":"Link the moons into a chain (for steps in order)","default":false,"group":"Look"},
  {"id":"planetColor","type":"color","label":"Centre planet colour","default":"#F48301","group":"Look"},
  {"id":"duration","type":"number","label":"Length (seconds; with a voiceover, at least until it ends)","default":10,"min":2,"max":120,"step":0.5,"group":"Pacing"},
  {"id":"pace","type":"number","label":"Pace (1 = normal; real films hold 7–9 s a shot, 2–3 is common)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Pacing"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>framehand · Flat explainer</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05020F; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #05020F; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Flat explainer (y1): a glowing planet in a deep indigo sky is the idea, each point is a moon; `enter` sends the camera into one moon,
  pushing until its colour fills the screen, then pulls out of a new planet of the same colour — "what is inside". The picture is always gently moving.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: y1_kurzgesagt, from framehand, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the thing first
    shows; `word` anchors it to that word of the narration once `om voice` has run (skills/framehand/references/grammars.md).
  - Points after an `enter` belong to the new layer; write their `at` after enter.at + 1.6 (the dive takes 1.6 s).
  - Pickable regions (0-based like the spec): title · planet (the centre of the layer on screen) · point-<i> (node + label).
  - Scenes: title → layer-1 → dive-1 → layer-2 → focus-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="sky" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y1_kurzgesagt",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "center": "{{center}}", "flow": "{{flow}}", "planetColor": "{{planetColor}}" },
  "cues": [
    { "at": 0.0, "kind": "title", "text": "{{title}}" },
    { "at": 1.4, "kind": "point", "word": "aromas", "text": "{{point1}}" },
    { "at": 2.3, "kind": "point", "word": "oils", "text": "{{point2}}" },
    { "at": 3.2, "kind": "point", "word": "caffeine", "text": "{{point3}}" },
    { "at": 4.2, "kind": "enter", "word": "inside", "text": "{{dive}}", "data": { "index": "{{diveIndex}}" } },
    { "at": 6.2, "kind": "point", "word": "flavour", "text": "{{point4}}" },
    { "at": 7.0, "kind": "point", "word": "crema", "text": "{{point5}}" },
    { "at": 8.0, "kind": "highlight", "word": "most", "data": { "index": "{{highlightIndex}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y1_kurzgesagt.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      // indexes count the points of one layer; keep them inside that layer
      const enterAt = (spec.cues.find((q) => q.kind === 'enter') || {}).at ?? Infinity;
      const outer = spec.cues.filter((q) => q.kind === 'point' && q.at < enterAt).length, inner = spec.cues.filter((q) => q.kind === 'point' && q.at > enterAt).length;
      const layer = enterAt === Infinity ? outer : inner; // a highlight counts the points of the layer it is in
      for (const q of spec.cues) {
        if (q.kind === 'enter' && !(q.data.index >= 0 && q.data.index < outer)) { CLIP.problem(`diveIndex must be between 0 and ${outer - 1}`); q.data.index = Math.max(0, outer - 1); }
        if (q.kind === 'highlight' && q.data.index >= layer) CLIP.problem(`highlightIndex is past the last satellite of this layer (${layer})`);
      }
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || (q.data.index >= 0 && q.data.index < layer));
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
