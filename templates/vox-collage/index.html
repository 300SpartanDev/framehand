<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title strip (white on black, typed on)","default":"How a small shop gets noticed","group":"Text"},
  {"id":"image1","type":"string","label":"Picture 1 path (screenshot or clipping in assets/, relative to index.html)","default":"assets/sample-clipping.png","group":"Pictures"},
  {"id":"image1Label","type":"string","label":"Label under picture 1","default":"Sample clipping — replace with your own picture","group":"Pictures"},
  {"id":"highlightRect","type":"string","label":"Part of picture 1 to mark (JSON [x, y, width, height], 0–1 of the picture; empty = none)","default":"[0.1, 0.14, 0.8, 0.33]","group":"Pictures"},
  {"id":"note","type":"string","label":"Index card (lined card, typed on; empty = hidden)","default":"Show the work, not just the logo","group":"Text"},
  {"id":"image2","type":"string","label":"Picture 2 path (empty = hidden)","default":"","group":"Pictures"},
  {"id":"image2Label","type":"string","label":"Label under picture 2","default":"","group":"Pictures"},
  {"id":"halftone","type":"boolean","label":"Turn pictures into grey halftone (like newsprint)","default":false,"group":"Pictures"},
  {"id":"accent","type":"color","label":"Colour of the red lines and circles","default":"#b8433f","group":"Colours"},
  {"id":"duration","type":"number","label":"Length (seconds; with a voiceover, at least until it ends)","default":9,"min":2,"max":120,"step":0.5,"group":"Pacing"},
  {"id":"pace","type":"number","label":"Pace (1 = normal; a card usually holds 3–7 s)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Pacing"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>framehand · Collage desk</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e4ddcf; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #e4ddcf; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Collage desk (y2): one big desk is the world; pictures are laid down in order and joined with red lines; the camera glides after them while things on the desk step at 12 fps ("on twos").
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: y2_vox, from framehand, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the thing first
    shows; `word` anchors it to that word of the narration once `om voice` has run (skills/framehand/references/grammars.md).
  - Real screenshots stay as they are (contain, never cropped). Put your own files in assets/ and point image1 / image2 at them.
  - Pickable regions (0-based like the spec): title · image-<i> · note-<i> · highlight-<i>.
  - Scenes: title → image-1 → highlight-1 → note-1 → image-2.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="desk" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y2_vox",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "accent": "{{accent}}" },
  "cues": [
    { "at": 0.0, "kind": "title", "text": "{{title}}" },
    { "at": 1.6, "kind": "image", "word": "shop", "image": "{{image1}}", "text": "{{image1Label}}", "data": { "halftone": "{{halftone}}" } },
    { "at": 3.4, "kind": "highlight", "word": "noticed", "data": { "rect": "{{highlightRect|json}}" } },
    { "at": 5.6, "kind": "point", "word": "work", "text": "{{note}}" },
    { "at": 7.0, "kind": "image", "word": "vertical", "image": "{{image2}}", "text": "{{image2Label}}", "data": { "halftone": "{{halftone}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y2_vox.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      // an image cue without a path is not on the desk; a highlight needs the image before it and a rect
      spec.cues = spec.cues.filter((q) => q.kind !== 'image' || String(q.image || '').trim());
      spec.cues = spec.cues.filter((q, i) => q.kind !== 'highlight' || (Array.isArray(q.data && q.data.rect) && q.data.rect.length === 4 && spec.cues.slice(0, i).some((z) => z.kind === 'image')));
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
