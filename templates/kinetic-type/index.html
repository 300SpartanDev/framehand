<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"titleWord","type":"string","label":"Opening word","default":"AI writes code","group":"Opening"},
  {"id":"titleSub","type":"string","label":"Opening line","default":"in three stages","group":"Opening"},
  {"id":"item1","type":"string","label":"Item 1 word (empty = one page fewer)","default":"Complete","group":"Item 1"},
  {"id":"item1Sub","type":"string","label":"Item 1 line","default":"it finishes the next line","group":"Item 1"},
  {"id":"item1Key","type":"string","label":"Word to colour in item 1 line","default":"next line","group":"Item 1"},
  {"id":"item1Label","type":"string","label":"Item 1 small label","default":"Stage 01","group":"Item 1"},
  {"id":"item2","type":"string","label":"Item 2 word (empty = one page fewer)","default":"Chat","group":"Item 2"},
  {"id":"item2Sub","type":"string","label":"Item 2 line","default":"one line becomes a whole block","group":"Item 2"},
  {"id":"item2Key","type":"string","label":"Word to colour in item 2 line","default":"whole block","group":"Item 2"},
  {"id":"item2Label","type":"string","label":"Item 2 small label","default":"Stage 02","group":"Item 2"},
  {"id":"item3","type":"string","label":"Item 3 word (empty = one page fewer)","default":"Agent","group":"Item 3"},
  {"id":"item3Sub","type":"string","label":"Item 3 line","default":"you just say what you want","group":"Item 3"},
  {"id":"item3Key","type":"string","label":"Word to colour in item 3 line","default":"what you want","group":"Item 3"},
  {"id":"item3Label","type":"string","label":"Item 3 small label","default":"Stage 03","group":"Item 3"},
  {"id":"highlightWord","type":"string","label":"Word to highlight at the end (must be in the last page’s word; empty = none)","default":"Agent","group":"Ending"},
  {"id":"palette","type":"string","label":"Colours (JSON: [[background, text], …], one pair per page)","default":"[[\"#FFD23F\",\"#111111\"],[\"#FF5A36\",\"#FFFFFF\"],[\"#14213D\",\"#FFD23F\"],[\"#F4EFE6\",\"#111111\"]]","group":"Ending"},
  {"id":"duration","type":"number","label":"Length (seconds; with a voiceover, at least until it ends)","default":8,"min":2,"max":120,"step":0.5,"group":"Pacing"},
  {"id":"pace","type":"number","label":"Pace (1 = normal; each word holds at least 0.5 s, each line at least 1 s)","default":1,"min":0.5,"max":4,"step":0.1,"group":"Pacing"}
]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>framehand · Kinetic type</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #FFD23F; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FFD23F; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  Kinetic type (y5): the words are the actors. One cue per page; the main word slams in at its `at` frame, the line rises out of a slot; pages change with a colour wipe (starting 0.3 s before `at`).
  Two or more point pages make a list: a progress track and giant background numbers are drawn.
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: y5_kinetic_type, from framehand, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the frame the word slams in;
    `word` anchors it to that word of the narration once `om voice` has run (skills/framehand/references/grammars.md).
  - Pickable regions (0-based page index, title page = 0): word-<i> · sub-<i> · label-<i> · track · marker.
  - Scenes: title → item-1 → item-2 → item-3 → highlight-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->
  <canvas id="c" lang="en" width="1920" height="1080" data-om-id="page" data-layout-allow-overflow></canvas>
</div>

<script type="application/json" id="clip-spec">
{
  "grammar": "y5_kinetic_type",
  "duration": "{{duration}}",
  "pace": "{{pace}}",
  "fps": 30,
  "data": { "palette": "{{palette|json}}" },
  "cues": [
    { "at": 0.0, "kind": "title", "text": "{{titleWord}}", "sub": "{{titleSub}}" },
    { "at": 1.9, "kind": "point", "word": "Complete", "text": "{{item1}}", "sub": "{{item1Sub}}", "data": { "label": "{{item1Label}}", "key": "{{item1Key}}" } },
    { "at": 3.6, "kind": "point", "word": "Chat", "text": "{{item2}}", "sub": "{{item2Sub}}", "data": { "label": "{{item2Label}}", "key": "{{item2Key}}" } },
    { "at": 5.3, "kind": "point", "word": "Agent", "text": "{{item3}}", "sub": "{{item3Sub}}", "data": { "label": "{{item3Label}}", "key": "{{item3Key}}" } },
    { "at": 6.4, "kind": "highlight", "word": "want", "data": { "word": "{{highlightWord}}" } }
  ]
}
</script>

<script src="vendor/clip/lib/util.js"></script>
<script src="vendor/clip/lib/paint.js"></script>
<script src="vendor/clip/lib/kit.js"></script>
<script src="vendor/clip/lib/motion.js"></script>
<script src="vendor/clip/lib/camera.js"></script>
<script src="vendor/clip/lib/diagram.js"></script>
<script src="vendor/clip/lib/typo.js"></script>
<script src="vendor/clip/lib/chart.js"></script>
<script src="vendor/clip/lib/ui.js"></script>
<script src="vendor/clip/lib/collage.js"></script>
<script src="vendor/clip/lib/toon.js"></script>
<script src="vendor/clip/cues.js"></script>
<script src="vendor/clip/clip.js"></script>
<script src="vendor/clip/grammars/y5_kinetic_type.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      const pal = spec.data.palette;
      if (pal !== undefined && !(Array.isArray(pal) && pal.length && pal.every((p) => Array.isArray(p) && p.length === 2))) { CLIP.problem('palette must look like [[background, text], …]'); delete spec.data.palette; }
      if (pal === undefined) delete spec.data.palette;
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || String(q.data.word || '').trim());
      return spec;
    },
  });
  window.__timelines['film'] = tl;
</script>
</body>
</html>
